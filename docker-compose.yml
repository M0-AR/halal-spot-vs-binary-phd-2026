services:
  research:
    build: .
    container_name: halal-trading-research
    volumes:
      - .:/workspace
      - ./results:/workspace/results
      - ./figures:/workspace/figures
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/src
      - TZ=UTC
    command: bash -c "pip install -q -r requirements.txt && python src/experiments/run_all.py"
  jupyter:
    build: .
    container_name: halal-trading-jupyter
    volumes:
      - .:/workspace
    working_dir: /workspace
    ports:
      - "8888:8888"
    command: bash -c "pip install -q -r requirements.txt && jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='halal2026'"
    profiles: ["lab"]
